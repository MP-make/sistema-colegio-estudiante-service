services:
  db-estudiantes:
    image: mysql:8.0
    container_name: estudiante-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_estudiantes
    ports:
      - "3306:3306"
    volumes:
      - estudiante_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  estudiante_mysql_data:
